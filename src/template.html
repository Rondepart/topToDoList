<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP - To do list</title>
</head>
<body>
    <div class="layout">
        <header class="header">
            <h2 class="header-title">Todo List</h2>
        </header>
        <div class="main-wrapper">
            <nav class="sidebar">
                <h2 class="sidebar-title">Projects</h2>

                <button class="addProject-btn" type="button" command="show-modal" commandfor="add-project">+ Add Project</button>
                <dialog id="add-project" class="add-project">
                    <div class="dialog-content-wrapper">
                        <div class="dialog-header">
                            <h3>Enter your project name</h3>
                            <div class="dialog-actions">
                                <button type="button" commandfor="add-project" command="close">X</button>
                            </div>
                        </div>
                        <form class="add-project-form">
                            <div class="add-project-form-wrapper">
                                <label for="project-title">Project name:
                                    <input type="text" id="project-title" class="project-title" name="projectTitle" maxlength="20" required>
                                </label>
                                <button type="submit" class="create-project">Create New Project</button>
                                <button type="button" commandfor="add-project" command="close">Cancel</button>
                            </div>
                        </form>
                    </div>    
                </dialog>

                <!-- edit project modal, accessed by dynamically created btn from DOM -->
                <dialog id="edit-project" class="edit-project">
                    <div class="dialog-content-wrapper">
                        <div class="dialog-header">
                            <h3>Edit project details</h3>
                            <div class="dialog-actions">
                                <button type="button" commandfor="edit-project" command="close">X</button>
                            </div>
                        </div>
                        <form class="edit-project-form">
                            <div class="edit-project-form-wrapper">
                                <label for="edit-project-title">Project Title:
                                    <input type="text" id="edit-project-title" class="edit-project-title" name="editProjectTitle" maxlength="20" required>
                                </label>
                                <button type="submit" class="save-edit-project">Save Changes</button>
                                <button type="button" commandfor="edit-project" command="close">Cancel</button>
                            </div>
                        </form>
                    </div>
                </dialog>

                <ul class="sidebar-projects">

                </ul>
            </nav>
            <main class="todolist-wrapper">
                <h2 class="todolist-title">Tasks</h2>

                <button type="button" class="addTask-btn" command="show-modal" commandfor="add-task">+ Add Task</button>
                <dialog id="add-task">
                    <div class="dialog-content-wrapper">
                        <div class="dialog-header">
                            <h3>Fill up required (*) forms to add task to your project</h3>
                            <div class="dialog-actions">
                                <button type="button" commandfor="add-task" command="close">X</button>
                            </div>
                        </div>
                        <form class="add-task-form">
                            <div class="add-task-form-wrapper">
                                <label for="task-title">*Task Title:
                                    <input type="text" id="task-title" class="task-title" name="taskTitle" placeholder="Enter task title" required>
                                </label>
                                <label for="task-description">*Description:
                                    <textarea name="taskDescription" id="task-description" class="task-description" rows="4" cols="40" placeholder="Enter task description..." required></textarea>
                                </label>
                                <label for="task-duedate">Due Date:
                                    <input type="date" id="task-duedate" class="task-duedate" name="taskDueDate">
                                </label>
                                <label for="task-priority">Task Priority:
                                    <select name="taskPriority" id="task-priority" class="task-priority">
                                        <option value="2">High</option>
                                        <option value="1">Moderate</option>
                                        <option value="0" selected>Low</option>
                                    </select>
                                </label>
                                <label for="task-note">Note:
                                    <textarea name="taskNote" id="task-note" class="task-note" rows="3" cols="40" placeholder="Enter additional note..."></textarea>
                                </label>
                                <button type="submit" class="create-task">Create New Task</button>
                                <button type="button" commandfor="add-task" command="close">Cancel</button>
                            </div>
                        </form>
                    </div>
                </dialog>

                <!-- edit task modal, accessed through dynamically created btn on DOM-->
                <dialog id="edit-task">
                    <div class="dialog-content-wrapper">
                        <div class="dialog-header">
                            <h3>Edit task details</h3>
                            <div class="dialog-actions">
                                <button type="button" commandfor="edit-task" command="close">X</button>
                            </div>
                        </div>
                        <form class="edit-task-form">
                            <div class="edit-task-form-wrapper">
                                <label for="edit-task-title">Task Title:
                                    <input type="text" class="edit-task-title" id="edit-task-title" name="editTaskTitle" placeholder="Enter new title">
                                </label>
                                <label for="edit-task-description">Task Description:
                                    <textarea class="edit-task-description" id="edit-task-description" name="editTaskDescription" rows="4" cols="40" placeholder="Enter new description"></textarea>
                                </label>
                                <label for="edit-task-duedate">Due Date:
                                    <input type="date" id="edit-task-duedate" class="edit-task-duedate" name="editTaskDueDate">
                                </label>
                                <label for="edit-task-priority">Task Priority:
                                    <select name="editTaskPriority" id="edit-task-priority" class="edit-task-priority">
                                        <option value="2">High</option>
                                        <option value="1">Moderate</option>
                                        <option value="0" selected>Low</option>
                                    </select>
                                </label>
                                <label for="edit-task-note">Note:
                                    <textarea name="editTaskNote" id="edit-task-note" class="edit-task-note" rows="3" cols="40" placeholder="Enter additional note..."></textarea>
                                </label>
                                <button type="submit" class="save-edit-task">Save Changes</button>
                                <button type="button" commandfor="edit-task" command="close">Cancel</button>
                            </div>
                        </form>
                    </div>
                </dialog>
                <!-- DOM empty & repopulate todolist-section elements dont put elements inside it-->
                <div class="todolist-section">

                </div>
            </main>
        </div>
    </div>
</body>
</html>
